spring.application.name=account

# MySQL
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/account_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA — update keeps data between restarts; create-drop is for dev reset
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true

# Data already seeded — set to always only for fresh installs
spring.sql.init.mode=never

server.port=${PORT:8080}
logging.level.com.happizo=INFO

